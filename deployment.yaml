# ==============================================================================
# DMS Help Desk Management System — Kubernetes Deployment Manifest
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: dms
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-backend
  namespace: dms
  labels:
    app: dms-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dms-backend
  template:
    metadata:
      labels:
        app: dms-backend
    spec:
      containers:
        - name: backend
          image: deme22/dms:backend-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: dms-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: dms-backend
  namespace: dms
spec:
  selector:
    app: dms-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-frontend
  namespace: dms
  labels:
    app: dms-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dms-frontend
  template:
    metadata:
      labels:
        app: dms-frontend
    spec:
      containers:
        - name: frontend
          image: deme22/dms:frontend-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
            - containerPort: 5173
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dms-frontend
  namespace: dms
spec:
  type: LoadBalancer
  selector:
    app: dms-frontend
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
    - name: vite
      protocol: TCP
      port: 5173
      targetPort: 5173
