$kind: http-request
url: "{{baseUrl}}/tickets/{{ticketId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "resolved",
      "notes": "Gateway service operational"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 6000
