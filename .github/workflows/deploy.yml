name: DMS CI/CD Automated Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. VERIFY & TEST: Ensure code compiles without syntax or type errors
  # ────────────────────────────────────────────────────────────────────────────
  verify-and-test:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      - name: Verify Backend Dependencies & Syntax
        working-directory: backend
        run: |
          npm ci --prefer-offline || npm install
          node -c server.js
          node -c app.js

      - name: Build Frontend Application
        working-directory: frontend
        run: |
          npm ci --prefer-offline || npm install
          npm run build

  # ────────────────────────────────────────────────────────────────────────────
  # 2. DOCKER BUILD & PUSH: Package container images and push to Docker Hub
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    needs: verify-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            deme22/dms:backend-latest
            deme22/dms:backend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Frontend Image
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            deme22/dms:frontend-latest
            deme22/dms:frontend-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY TO VPS: Connect to VPS over SSH and update running containers
  # ────────────────────────────────────────────────────────────────────────────
  deploy-to-vps:
    name: Deploy to Linux VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger VPS Container Update via SSH
        if: env.VPS_HOST != ''
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.VPS_DEPLOY_PATH || '/var/www/dms' }}"
            if [ ! -d "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/dms"
            fi
            echo "Navigating to deployment directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # Pull latest code or updated compose file
            if [ -d ".git" ]; then
              git pull origin main || true
            fi

            echo "Pulling latest Docker images..."
            docker compose -f docker-compose.deploy.yml pull || docker compose pull

            echo "Restarting production containers..."
            docker compose -f docker-compose.deploy.yml up -d --remove-orphans || docker compose up -d --remove-orphans

            echo "Cleaning unused images..."
            docker image prune -af --filter "until=72h" || true

            echo "Deployment to VPS completed successfully!"
