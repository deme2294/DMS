  ## 2. Tickets Management (`/api/tickets`)

  | Method | Endpoint | Auth / Role | Description | Parameters / Payload |
  |---|---|---|---|---|
  | `GET` | `/api/tickets/track/:trackNumber` | **Public** | Public tracking of ticket status | **Path:** `trackNumber` (string) |
  | `GET` | `/api/tickets/categories` | `tickets.read` \| `tickets.create` | Get active ticket categories | None |
  | `GET` | `/api/tickets` | `tickets.read` \| `tickets.create` | List tickets with pagination & filters | **Query:**<br>• `page?` (int)<br>• `limit?` (int)<br>• `status?` (`open`, `pending`, `in_progress`, `resolved`, `closed`, `cancelled`)<br>• `priority?` (`low`, `medium`, `high`, `urgent`)<br>• `sortBy?`<br>• `sortOrder?` (`ASC` \| `DESC`) |
  | `GET` | `/api/tickets/notifications` | `tickets.read` \| `tickets.create` | Get user ticket notifications | None |
  | `GET` | `/api/tickets/notifications/unread-count` | `tickets.read` \| `tickets.create` | Get unread count of notifications | None |
  | `PATCH` | `/api/tickets/notifications/:id/read` | `tickets.read` \| `tickets.create` | Mark single notification as read | **Path:** `id` (UUID) |
  | `PATCH` | `/api/tickets/notifications/read-all` | `tickets.read` \| `tickets.create` | Mark all notifications as read | None |
  | `DELETE` | `/api/tickets/notifications/:id` | `tickets.read` \| `tickets.create` | Delete notification | **Path:** `id` (UUID) |
  | `GET` | `/api/tickets/:id` | `tickets.read` \| `tickets.create` | Get ticket details by ID | **Path:** `id` (UUID) |
  | `GET` | `/api/tickets/:id/timeline` | `tickets.read` \| `tickets.create` | View ticket activity timeline | **Path:** `id` (UUID) |
  | `POST` | `/api/tickets` | `tickets.create` | Create a new support ticket | **Multipart / Form:**<br>• `title` (string, 3-200 chars)<br>• `description` (string)<br>• `category` (string)<br>• `priority?` (`low`, `medium`, `high`, `urgent`)<br>• `departmentId?` (UUID)<br>• `attachments?` (files, max 5) |
  | `PUT` | `/api/tickets/:id` | `tickets.read` \| `tickets.assign` \| `tickets.create` | Update ticket metadata | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `title?`, `description?`, `category?`, `priority?`, `departmentId?`, `assignedTo?` |
  | `POST` | `/api/tickets/:id/assign-department` | Role: `admin` | Assign ticket to a department | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `departmentId` (UUID)<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/assign-staff` | `tickets.assign` | Assign ticket to a staff member | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `staffId` (UUID)<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/reassign` | `tickets.reassign` | Reassign ticket to another staff | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `staffId` (UUID)<br>• `notes?` (string) |
  | `PATCH` | `/api/tickets/:id/assignment` | Role: `admin` | Admin override of assignment | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `assignedTo?` (UUID)<br>• `assignedBy?` (UUID)<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/accept` | `tickets.assign` \| `tickets.read` | Staff / Manager accepts assigned ticket | **Path:** `id` (UUID) |
  | `POST` | `/api/tickets/:id/reject` | `tickets.assign` \| `tickets.read` | Staff / Manager rejects assignment | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `reason?` (string) |
  | `POST` | `/api/tickets/:id/escalate` | `tickets.escalate` \| `tickets.assign` | Escalate ticket to higher authority | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/merge` | Role: `admin` | Merge duplicate tickets into this one | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `sourceIds` (UUID[])<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/close` | `tickets.close` \| `tickets.assign` | Close ticket | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/reopen` | `tickets.reopen` \| `tickets.assign` | Reopen ticket | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/complete` | `tickets.complete` | Manager marks ticket work completed | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/approve` | `tickets.approve` \| `tickets.create` | Approve resolution (Admin or Tenant) | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `notes?` (string) |
  | `POST` | `/api/tickets/:id/reject-completion` | `tickets.approve` \| `tickets.create` | Reject completion/resolution | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `notes?` (string) |
  | `PATCH` | `/api/tickets/:id/priority` | `tickets.change_priority` \| `tickets.assign` | Change ticket priority | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `priority`: `low` \| `medium` \| `high` \| `urgent` |
  | `PATCH` | `/api/tickets/:id/category` | `tickets.change_category` \| `tickets.assign` | Change ticket category | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `category`: string |
  | `POST` | `/api/tickets/:id/internal-note` | `tickets.internal_note` | Add private note (staff/admin/manager) | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `message` (string)<br>• `departmentId?` (UUID) |
  | `PATCH` | `/api/tickets/:id/status` | Authorized roles | Change status directly | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `status` (string)<br>• `notes?`<br>• `departmentId?`<br>• `assignedTo?` |
  | `POST` | `/api/tickets/:id/attachments` | `tickets.read` \| `tickets.create` | Upload ticket attachments | **Path:** `id` (UUID)<br>**Multipart Form:** `attachments` (max 5) |
  | `POST` | `/api/tickets/:id/replies` | `tickets.read` \| `tickets.create` | Add public or internal reply | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `message` (string)<br>• `visibility?` (`all` \| `internal`)<br>• `attachmentId?` (UUID) |
  | `GET` | `/api/tickets/:id/replies` | `tickets.read` \| `tickets.create` | List replies for a ticket | **Path:** `id` (UUID) |
  | `DELETE` | `/api/tickets/:id` | Role: `admin` | Permanently delete ticket | **Path:** `id` (UUID) |

