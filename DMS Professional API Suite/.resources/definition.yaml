  | Method | Endpoint | Auth / Role | Description | Parameters / Payload |
  |---|---|---|---|---|
  | `GET` | `/api/notices/public` | **Public** | Public broadcast announcements | None |
  | `GET` | `/api/notices/categories` | **Public** | Notice categories | None |
