  | `GET` | `/api/notices/:id/replies` | `notices.read` | Get discussions/replies on notice | **Path:** `id` (UUID) |
  | `POST` | `/api/notices/:id/replies` | `notices.read` | Reply to notice | **Path:** `id` (UUID)<br>**JSON Body:**<br>• `message` (string)<br>• `visibility?` (`all` \| `internal`) |
  | `PUT` | `/api/notices/replies/:id` | `notices.read` | Update notice reply | **Path:** `id` (UUID)<br>**JSON Body:** `message?`, `visibility?` |
  | `DELETE` | `/api/notices/replies/:id` | `notices.read` | Delete notice reply | **Path:** `id` (UUID) |
  | `GET` | `/api/notices` | `notices.read` | List all system notices (admin) | **Query:** `page?`, `limit?` |
  | `GET` | `/api/notices/me/acknowledgements` | `notices.read` | Notices current user has acknowledged | None |
  | `GET` | `/api/notices/:id` | `notices.read` | Get single notice by ID | **Path:** `id` (UUID) |
  | `POST` | `/api/notices` | `notices.create` | Create global notice | **JSON Body:**<br>• `title`, `description`, `priority?`, `expiresAt?`, etc. |
  | `PUT` | `/api/notices/:id` | `notices.update` | Update notice | **Path:** `id` (UUID) |
  | `DELETE` | `/api/notices/:id` | `notices.delete` | Delete notice | **Path:** `id` (UUID) |
  | `POST` | `/api/notices/:id/acknowledge` | `notices.read` | Mark notice as read/acknowledged | **Path:** `id` (UUID) |
  | `GET` | `/api/notices/:id/recipients` | `notices.read` | View recipients and acknowledge status | **Path:** `id` (UUID) |
  | `GET` | `/api/notices/:id/recipients/counts` | `notices.read` | Aggregated count of read vs unread | **Path:** `id` (UUID) |
  | `POST` | `/api/notices/process-expirations` | `notices.manage` | Trigger cron expiry job manually | None |

