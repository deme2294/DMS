  # DMS (Document / Help Desk Management System) - API Endpoint Documentation

  > **Base URL:** `http://localhost:5000/api`  
  > **Server Engine:** Express.js + MySQL  
  > **Authentication:** Bearer JWT in `Authorization: Bearer <access_token>` or HTTP-only Refresh Cookie  
  > **Postman Ready Files:**  
  > - 📦 **OpenAPI 3.0.3 Spec:** [`openapi.json`](file:///c:/Users/hp/Desktop/DMS/openapi.json) (Direct Postman Import / Swagger UI)  
  > - 🚀 **Postman Collection v2.1.0:** [`dms_postman_collection.json`](file:///c:/Users/hp/Desktop/DMS/dms_postman_collection.json) (Pre-configured 115 requests with token handling)  
  > - 🌐 **Postman Environment:** [`dms_postman_environment.json`](file:///c:/Users/hp/Desktop/DMS/dms_postman_environment.json) (Local environment variables)  

