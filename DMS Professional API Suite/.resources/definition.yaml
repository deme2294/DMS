  ## 1. Authentication & Profile (`/api/auth`)

  | Method | Endpoint | Auth / Role | Description | Parameters / Payload |
  |---|---|---|---|---|
  | `POST` | `/api/auth/login` | **Public** (Rate limited: 20 req / 15 min) | Authenticate user and obtain access token | **JSON Body:**<br>• `identifier` (string, username or email)<br>• `password` (string) |
  | `POST` | `/api/auth/refresh` | **Public / Cookie** | Refresh expired access token | **Cookie:** `refreshToken`<br>*(or body `refreshToken`)* |
  | `GET` | `/api/auth/me` | Authenticated | Get current authenticated user details and permissions | **Header:** `Authorization: Bearer <token>` |
  | `POST` | `/api/auth/logout` | Authenticated | Invalidate refresh session and clear cookie | **Header:** `Authorization: Bearer <token>` |
  | `PATCH` | `/api/auth/me/profile` | Authenticated | Update current user's profile | **Multipart / JSON:**<br>• `username?`<br>• `email?`<br>• `firstName?`<br>• `lastName?`<br>• `phone?`<br>• `currentPassword?`<br>• `newPassword?`<br>• `confirmPassword?`<br>• `profileImage?` (file) |
  | `PATCH` | `/api/auth/me/theme` | Authenticated | Save UI theme preference | **JSON Body:**<br>• `themePreference`: `'system'` \| `'light'` \| `'dark'` |

