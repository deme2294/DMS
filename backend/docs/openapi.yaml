      operationId: listTickets
      summary: List & Filter Tickets
      description: |-
        Queries tickets with pagination and filtering.
        - **Tenant:** Automatically scoped to caller's tenant organization.
        - **Staff / Manager:** Scoped to departmental assignments.
        - **Admin / CEO:** Global visibility.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum:
              - open
              - assigned
              - in_progress
              - pending
              - waiting_tenant
              - waiting_vendor
              - resolved
              - reopened
              - closed
              - completed
        - name: priority
          in: query
          schema:
            type: string
            enum:
              - low
              - medium
              - high
              - urgent
        - name: sortBy
          in: query
          schema:
            type: string
            default: created_at
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
      responses:
        "200":
          description: Ticket page retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
