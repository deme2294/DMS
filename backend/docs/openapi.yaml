            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /uploads/{subfolder}/{filename}:
    get:
      tags:
        - 23. Static Uploads
      operationId: getUploadedStaticFile
      summary: Retrieve Static Uploaded File
      description: "Fetches static uploaded file (ticket attachment, avatar, chat
        file, or knowledge document). Cross-Origin Resource Policy:
        `cross-origin`."
      security: []
      parameters:
        - name: subfolder
          in: path
          required: true
          schema:
            type: string
            enum:
              - tickets
              - users
              - chat
              - knowledge
          example: tickets
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: gateway_logs-1729600000000.log
      responses:
        "200":
          description: Raw file binary stream
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found
