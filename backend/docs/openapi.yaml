openapi: 3.0.3
info:
  title: DMS Help Desk Management System - Developer & Integration API
  version: 1.0.0
  description: >
    # DMS Help Desk Management System - Comprehensive API Specification


    Welcome to the official OpenAPI 3.0.3 specification for the **DMS (Help Desk
    Management System)** backend. This document provides complete coverage of
    all REST endpoints, request payloads, response envelopes, role permissions,
    and WebSocket integration details.


    ---


    ### 🚀 Postman Quick-Start Guide


    1. **Importing into Postman:**
       - In Postman, click **Import** (top left).
       - Select or drag-and-drop this `openapi.yaml` file.
       - Postman will automatically create a new Collection titled **"DMS Help Desk Management System - Developer & Integration API"** containing all endpoints organized by domain folders.

    2. **Server & Variables Setup:**
       - The default base URL is configured to `http://localhost:5005` (or your staging/production URL).
       - In Postman Collection Variables, ensure `baseUrl` is set to `http://localhost:5005`.

    3. **Automatic Bearer Token Capture:**
       - Open the request: **02. Authentication & Identity -> Authenticate User Credentials (POST /api/auth/login)**.
       - Go to the **Scripts / Tests** tab and paste the following snippet:
         ```javascript
         const response = pm.response.json();
         if (response.success && response.token) {
             pm.collectionVariables.set("bearerToken", response.token);
             console.log("✅ DMS JWT Bearer Token captured:", response.token.substring(0, 16) + "...");
         }
         ```
       - Set the collection **Authorization** type to **Bearer Token** with Token: `{{bearerToken}}`.
       - Now, all authenticated requests in the collection automatically inherit and use your JWT!

    4. **Default Developer Test Accounts (Seed/Standard):**
       - **System Admin:** `admin` (or `admin@demo.gov`) / `password` (Full access across all modules)
       - **CEO Executive:** `ceo` (or `ceo@demo.gov`) / `password` (Executive dashboards, analytics, ticket merge)
       - **Department Manager:** `manager` (or `manager@demo.gov`) / `password` (Department queue, staff assignment, approval)
       - **Technical Staff:** `staff` (or `staff@demo.gov`) / `password` (Ticket execution, internal notes, resolution)
       - **Tenant / Customer:** `tenant` (or `misgenaht@gmail.com`) / `password` (Ticket submission, public KB, resolution sign-off)

    ---


    ### 🛡️ Authentication & Authorization Model

    - **Mechanism:** JWT Bearer token passed in the `Authorization` header:
      ```http
      Authorization: Bearer <jwt_access_token>
      ```
    - **Refresh Token:** Supported via HTTP-only `refreshToken` cookie via `POST
    /api/auth/refresh`.

    - **Role Hierarchy:** `admin` > `ceo` > `manager` > `staff` > `tenant`.

    - **Tenant Isolation:** For `tenant` users, queries are strictly scoped to
    the tenant's organization id extracted from the signed JWT.


    ---


    ### ⚡ Real-Time Socket.IO Events Reference

    The backend exposes a Socket.IO server at `ws://localhost:5005` (path:
    `/socket.io`).

    - **Authentication:** Pass `auth: { token: "<jwt_access_token>" }` or query
    param `token` during handshake.

    - **Client to Server Events:**
      - `join-room`: `{ roomId }` (Join chat conversation room)
      - `leave-room`: `{ roomId }` (Leave chat conversation room)
      - `send-message`: `{ roomId, message, messageType, attachmentId }`
      - `typing`: `{ roomId, isTyping: true/false }`
      - `mark-read`: `{ roomId, messageIds: [...] }`
    - **Server to Client Broadcasts:**
      - `new-message`: Full message object broadcasted to room participants.
      - `user-typing`: `{ userId, username, isTyping, roomId }`
      - `message-read`: `{ roomId, userId, messageIds }`
      - `user-status-changed`: `{ userId, status: "online" | "offline" }`
      - `ticket-updated`: Real-time notification when status, assignment, or priority changes.
      - `new-notice`: Broadcast when new targeted or public notice is published.

    ---


    ### 📁 File Uploads & Limits

    - **Max File Size:** 10MB per file.

    - **Allowed Formats:** JPG, JPEG, PNG, PDF, DOC, DOCX, XLS, XLSX, ZIP, TXT,
    LOG.

    - **Static Retrieval URL:** `GET {baseUrl}/uploads/{subfolder}/{filename}`
    with `Cross-Origin-Resource-Policy: cross-origin`.
  contact:
    name: DMS API Integration Team
    email: api-support@example.com
    url: https://dms-helpdesk.example.com/support
  license:
    name: Proprietary
servers:
  - url: http://localhost:5000
    description: Local Development Server (Current Port 5000)
  - url: http://localhost:5005
    description: Local Development Server (Default Port 5005)
  - url: https://dms-api.example.com
    description: Staging / Production Environment
tags:
  - name: 01. System & Health
    description: Operational heartbeat, uptime, database pool status and diagnostics
  - name: 02. Authentication & Identity
    description: JWT issuance, session validation, profile & theme preferences
  - name: 03. User Management
    description: User provisioning, directory lookups, role assignments, activation
      and password resets
  - name: 04. Department Management
    description: Department hierarchies, heads of department, and member staffing
  - name: 05. Assignment Matrix
    description: User-to-Department routing matrix grid, assignments, and quick toggles
  - name: 06. Tickets - Core Lifecycle
    description: Ticket creation, query filtering, single lookups, and audit timelines
  - name: 07. Tickets - Workflow & Status
    description: State machine transitions, completion verification, approvals, and
      reopenings
  - name: 08. Tickets - Assignment & Routing
    description: Department routing, staff dispatch, overrides, and duplicate merge
  - name: 09. Tickets - Discussions & Notes
    description: Public replies, scoped participant threads, and private technician notes
  - name: 10. Tickets - Attachments
    description: Multipart diagnostic file uploads and file attachments
  - name: 11. Tickets - Notifications
    description: In-app ticket notification polling, read status tracking, and deletions
  - name: 12. Ticket Categories & Routing
    description: Service catalog categories, routing rules, and manager request review queue
  - name: 13. Service Level Agreements (SLA)
    description: SLA policy definitions, deadline simulation, and operational targets
  - name: 14. Tenant Management & Registration
    description: Tenant self-registration, organizational profile management, and
      approval queue
  - name: 15. Notices & Announcements
    description: Broadcast notices, targeted departmental bulletins, expiry
      scheduling, and acknowledgements
  - name: 16. Knowledge Base Articles
    description: Multi-stage KB authoring, revisions, versions, approval workflow,
      and public articles
  - name: 17. Chat, Presence & Video Meetings
    description: Chat rooms, real-time messaging, attachments, online status, and
      video meeting invites
  - name: 18. Dashboards & Analytics
    description: Role-tailored dashboards for Admin, CEO Executive, Manager, Staff,
      and Tenant
  - name: 19. Reports & Exports
    description: Operational metrics and Excel/CSV report data exports
  - name: 20. Feedback & Surveys
    description: Tenant satisfaction ratings, feedback submissions, and
      administrative responses
  - name: 21. Audit Logs & Compliance
    description: Security audit trail logging, action filter queries, and compliance exports
  - name: 22. Direct Email & Communications
    description: Direct email dispatch handler for ad-hoc communications
  - name: 23. Static Uploads
    description: Public static retrieval for ticket, user profile, chat, and knowledge files
paths:
  /api:
    get:
      tags:
        - 01. System & Health
      operationId: getServiceInfo
      summary: Root Service Status & Subsystem Health
      description: Retrieves current API service name, version, operational status,
        database connectivity probe, and active Socket.IO client connections.
      security: []
      responses:
        "200":
          description: Service info and operational health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfoResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/health:
    get:
      tags:
        - 01. System & Health
      operationId: getHealthProbe
      summary: Service Liveness & Database Readiness Probe
      description: Heartbeat probe for load balancers and container orchestration
        (Kubernetes/Docker). Verifies active MySQL connection.
      security: []
      responses:
        "200":
          description: System is healthy and accepting traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          description: Database unreachable / degraded status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      tags:
        - 02. Authentication & Identity
      operationId: loginUser
      summary: Authenticate User Credentials (Get JWT)
      description: >-
        Authenticates a user by username or email and password.

        Returns a signed JWT bearer token and sets an HTTP-only `refreshToken`
        cookie.

        *Rate-limited to 20 attempts per 15 minutes.*


        **Postman Tip:** Use the test script to automatically save
        `response.token` into collection variable `{{bearerToken}}`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/refresh:
    post:
      tags:
        - 02. Authentication & Identity
      operationId: refreshToken
      summary: Refresh JWT Access Token
      description: Issues a fresh access token using the HTTP-only `refreshToken` cookie.
      security: []
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      tags:
        - 02. Authentication & Identity
      operationId: getCurrentUser
      summary: Get Authenticated User Profile & Permissions
      description: Validates bearer token and returns caller identity, role,
        department affiliations, tenant bindings, and assigned permission list.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Caller profile and permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me/profile:
    patch:
      tags:
        - 02. Authentication & Identity
      operationId: updateMyProfile
      summary: Update Current User Profile & Password
      description: Allows authenticated user to update their name, phone, email,
        password, and upload a profile avatar.
      security:
        - BearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: john_doe_updated
                email:
                  type: string
                  format: email
                  example: john.updated@example.com
                firstName:
                  type: string
                  example: John
                lastName:
                  type: string
                  example: Doe
                phone:
                  type: string
                  example: +1-555-0144
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                confirmPassword:
                  type: string
                  format: password
                profileImage:
                  type: string
                  format: binary
                  description: Avatar image (JPEG, PNG)
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me/theme:
    patch:
      tags:
        - 02. Authentication & Identity
      operationId: updateMyTheme
      summary: Update User Theme Preference
      description: Sets system, light, or dark theme preference for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - themePreference
              properties:
                themePreference:
                  type: string
                  enum:
                    - system
                    - light
                    - dark
                  example: dark
      responses:
        "200":
          description: Theme updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags:
        - 02. Authentication & Identity
      operationId: logoutUser
      summary: Logout & Invalidate Session
      description: Invalidates server session and clears authentication cookies.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/roles:
    get:
      tags:
        - 03. User Management
      operationId: getUserRoles
      summary: List Configured Roles
      description: Returns all system roles and their assigned permission templates.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Role list retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 1
                        name:
                          type: string
                          example: admin
                        description:
                          type: string
                          example: System Administrator
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users:
    get:
      tags:
        - 03. User Management
      operationId: listUsers
      summary: List & Search System Users
      description: Lists users with role filtering, department filtering, and
        pagination. Requires `users.read` or `matrix.manage`.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
            enum:
              - admin
              - manager
              - staff
              - tenant
        - name: status
          in: query
          schema:
            type: string
            enum:
              - active
              - inactive
              - locked
        - name: departmentId
          in: query
          schema:
            type: string
          example: dept-infra-01
      responses:
        "200":
          description: Paginated users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  pagination:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - 03. User Management
      operationId: createUser
      summary: Create / Provision User Account
      description: Admin creates a new user with designated role, department, and
        profile image.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - firstName
                - lastName
                - roleId
              properties:
                username:
                  type: string
                  example: new_staff_01
                email:
                  type: string
                  format: email
                  example: staff01@example.com
                password:
                  type: string
                  format: password
                  minLength: 8
                  example: SecureStaff@123
                firstName:
                  type: string
                  example: Michael
                lastName:
                  type: string
                  example: Scott
                roleId:
                  type: integer
                  example: 3
                  description: 1=admin, 2=manager, 3=staff, 4=tenant, 5=ceo
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                  default: active
                profileImage:
                  type: string
                  format: binary
      responses:
        "201":
          description: User account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/{id}:
    get:
      tags:
        - 03. User Management
      operationId: getUserById
      summary: Get User By ID
      description: Fetches complete user record by UUID.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: a9b8c7d6-e5f4-4a3b-2c1d-0e9f8a7b6c5d
      responses:
        "200":
          description: User details retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - 03. User Management
      operationId: updateUser
      summary: Update User Details
      description: Updates user metadata, names, email, role, or status.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: a9b8c7d6-e5f4-4a3b-2c1d-0e9f8a7b6c5d
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: john_doe_modified
                email:
                  type: string
                  format: email
                  example: john.modified@example.com
                firstName:
                  type: string
                  example: Jonathan
                lastName:
                  type: string
                  example: Doe
                roleId:
                  type: integer
                  example: 2
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - locked
                profileImage:
                  type: string
                  format: binary
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden / Caller lacks required role or permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - 03. User Management
      operationId: deleteUser
      summary: Delete User Account
      description: Deletes user record. Requires `users.delete` permission.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: a9b8c7d6-e5f4-4a3b-2c1d-0e9f8a7b6c5d
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bad Request / Validation Failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Unauthorized / Missing or Expired JWT Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
