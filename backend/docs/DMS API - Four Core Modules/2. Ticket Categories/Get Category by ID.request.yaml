$kind: http-request
description: Retrieves detailed category record by ID.
url: "{{baseUrl}}/api/ticket-categories/{{categoryId}}"
method: GET
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.collectionVariables.get('categoryId') || pm.collectionVariables.get('categoryId') === '{{categoryId}}') {
          pm.collectionVariables.set('categoryId', 'cat00004-0000-0000-0000-000000000004');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      pm.test('Category matches ID', function () {
          pm.expect(jsonData.data.id).to.eql(pm.collectionVariables.get('categoryId'));
      });
    language: text/javascript
order: 2000
