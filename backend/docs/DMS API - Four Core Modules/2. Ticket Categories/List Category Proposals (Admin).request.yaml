$kind: http-request
description: Lists pending manager category proposals for Admin review.
url: "{{baseUrl}}/api/ticket-categories/requests"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
