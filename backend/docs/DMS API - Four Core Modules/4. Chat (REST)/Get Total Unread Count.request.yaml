$kind: http-request
description: Returns total unread count across caller rooms.
url: "{{baseUrl}}/api/chat/unread"
method: GET
headers:
  Authorization: Bearer {{tenantToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
