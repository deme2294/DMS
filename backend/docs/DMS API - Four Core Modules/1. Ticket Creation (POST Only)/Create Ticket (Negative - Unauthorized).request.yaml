$kind: http-request
description: Verifies unauthenticated ticket creation is blocked with HTTP 401.
url: "{{baseUrl}}/api/tickets"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: title
      value: Unauthorized Attempt
    - type: text
      key: description
      value: Should be rejected without Bearer token
    - type: text
      key: category
      value: Account Access
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401', function () {
          pm.response.to.have.status(401);
      });
    language: text/javascript
order: 3000
