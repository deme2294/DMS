$kind: http-request
description: Retrieves hours and thresholds for an SLA policy.
url: "{{baseUrl}}/api/sla/{{slaPolicyId}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.collectionVariables.get('slaPolicyId') || pm.collectionVariables.get('slaPolicyId') === '{{slaPolicyId}}') {
          pm.collectionVariables.set('slaPolicyId', 'sla00002-0000-0000-0000-000000000002');
      }
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
