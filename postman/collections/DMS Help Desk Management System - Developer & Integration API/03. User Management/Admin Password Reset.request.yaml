$kind: http-request
description: Administratively resets password for a target user.
url: "{{baseUrl}}/api/users/:id/reset-password"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  id: c1f7a840-a108-4e89-9a67-27b233a7e0f2
body:
  type: text
  content: |-
    {
      "newPassword": "NewSecretPass@2026"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 9000
