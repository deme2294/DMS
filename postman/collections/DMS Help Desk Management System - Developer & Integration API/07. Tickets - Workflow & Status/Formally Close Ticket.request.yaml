$kind: http-request
description: Closes ticket permanently.
url: "{{baseUrl}}/api/tickets/:id/close"
method: POST
headers:
  Content-Type: application/json
pathVariables:
  id: c1f7a840-a108-4e89-9a67-27b233a7e0f2
body:
  type: text
  content: |-
    {
      "notes": "Closing ticket as confirmed solved by client."
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 5000
