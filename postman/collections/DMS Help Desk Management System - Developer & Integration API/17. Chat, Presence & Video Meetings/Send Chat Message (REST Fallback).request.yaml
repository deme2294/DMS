$kind: http-request
description: Alternative REST endpoint to post a message and broadcast `new-message` to Socket.IO clients.
url: "{{baseUrl}}/api/chat/messages"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "roomId": "8f9e0d1c-2b3a-4c5d-6e7f-8a9b0c1d2e3f",
      "message": "We have updated DNS records and verified latency.",
      "messageType": "text"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 7000
