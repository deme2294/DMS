$kind: http-request
description: Find or Create 1-on-1 Direct Message Room
url: "{{baseUrl}}/api/chat/rooms/direct"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "userId": "a9b8c7d6-e5f4-4a3b-2c1d-0e9f8a7b6c5d",
      "name": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 5000
