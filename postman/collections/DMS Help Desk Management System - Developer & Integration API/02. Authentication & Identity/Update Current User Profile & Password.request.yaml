$kind: http-request
description: Allows authenticated user to update their name, phone, email, password, and upload a profile avatar.
url: "{{baseUrl}}/api/auth/me/profile"
method: PATCH
body:
  type: formdata
  content:
    - type: text
      key: username
      value: john_doe_updated
    - type: text
      key: email
      value: john.updated@example.com
    - type: text
      key: firstName
      value: John
    - type: text
      key: lastName
      value: Doe
    - type: text
      key: phone
      value: +1-555-0144
    - type: text
      key: currentPassword
      value: sample
    - type: text
      key: newPassword
      value: sample
    - type: text
      key: confirmPassword
      value: sample
    - type: file
      key: profileImage
      src:
        - ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 4000
