$kind: http-request
description: |-
  Authenticates a user by username or email and password.
  Returns a signed JWT bearer token and sets an HTTP-only `refreshToken` cookie.
  *Rate-limited to 20 attempts per 15 minutes.*

  **Postman Tip:** Use the test script to automatically save `response.token` into collection variable `{{bearerToken}}`.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "identifier": "admin",
      "password": "password"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const response = pm.response.json();
      const token = response.token || response.data?.accessToken;
      if (token) {
          pm.collectionVariables.set("bearerToken", token);
          console.log("✅ Bearer token successfully captured and saved to collection variables!");
      }
    language: text/javascript
order: 1000
