$kind: http-request
description: Update Authenticated Tenant Profile
url: "{{baseUrl}}/api/tenants/profile/me"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "contactPerson": "Alice Smith",
      "phone": "+1-555-0198",
      "address": "Suite 200, Innovation Blvd",
      "notes": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 3000
