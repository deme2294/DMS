$kind: http-request
description: Paginated department management list. Requires `departments.manage`.
url: "{{baseUrl}}/api/departments?page=1&limit=20&status=active"
method: GET
queryParams:
  page: "1"
  limit: "20"
  status: active
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 3000
