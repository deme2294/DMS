$kind: http-request
description: Admin/CEO creates an SLA policy enforcing `resolutionHours > responseHours`.
url: "{{baseUrl}}/api/sla"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "High Priority SLA",
      "priority": "high",
      "categoryId": "string",
      "responseHours": 2,
      "resolutionHours": 8,
      "escalationHours": 4,
      "workingHours": {
        "timezone": "UTC",
        "start": "08:00",
        "end": "18:00",
        "days": [
          1,
          2,
          3,
          4,
          5
        ]
      },
      "description": "Standard high-priority business SLA"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 3000
