$kind: http-request
description: Update KB Article Content
url: "{{baseUrl}}/api/knowledge/:id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  id: "1"
body:
  type: text
  content: |-
    {
      "title": "string",
      "content": "string",
      "category": "string"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
order: 5000
