$kind: http-request
name: Create Category (Admin / CEO)
description: Creates a new category directly approved by Admin.
url: "{{baseUrl}}/api/ticket-categories"
method: POST
headers:
  Authorization: Bearer {{adminToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Cloud Storage Issues",
      "description": "S3 bucket and blob sync errors",
      "routingType": "general"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201', function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 3000
