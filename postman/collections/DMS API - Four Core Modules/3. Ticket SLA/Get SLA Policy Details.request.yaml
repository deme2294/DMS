$kind: http-request
description: Retrieves hours and thresholds for an SLA policy.
url: "{{baseUrl}}/api/sla/{{slaPolicyId}}"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
