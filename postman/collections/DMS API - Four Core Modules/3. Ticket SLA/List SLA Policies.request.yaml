$kind: http-request
description: Lists configured SLA policies.
url: "{{baseUrl}}/api/sla"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      if (jsonData.data && jsonData.data.length > 0) {
          pm.collectionVariables.set('slaPolicyId', jsonData.data[0].id);
      }
    language: text/javascript
order: 2000
