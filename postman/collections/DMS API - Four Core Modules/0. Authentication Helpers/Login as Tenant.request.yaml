$kind: http-request
description: Authenticates as tenant user and automatically stores tenantToken.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "identifier": "tenant",
      "password": "password"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      var jsonData = pm.response.json();
      if (jsonData.success && jsonData.data && jsonData.data.accessToken) {
          pm.collectionVariables.set('tenantToken', jsonData.data.accessToken);
          console.log('tenantToken stored');
      }
    language: text/javascript
order: 1000
