$kind: http-request
description: Returns list of connected users.
url: "{{baseUrl}}/api/chat/online-users"
method: GET
headers:
  Authorization: Bearer {{tenantToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 5000
